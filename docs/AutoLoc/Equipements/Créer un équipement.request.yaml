$kind: http-request
url: "{{baseUrl}}/api/equipements"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "libelle": "GPS Navigation Pro"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => {
          pm.response.to.have.status(201);
      });
      var data = pm.response.json();
      pm.environment.set("equipementId", data.idEquipement);
    language: text/javascript
order: 2000
