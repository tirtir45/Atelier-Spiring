$kind: http-request
url: "{{baseUrl}}/api/paiements"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "montant": 100.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 405 Method Not Allowed", () => {
          pm.response.to.have.status(405);
      });
    language: text/javascript
order: 3000
