$kind: http-request
url: "{{baseUrl}}/api/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Agence Tunis Centre",
      "ville": "Tunis",
      "adresse": "10 Avenue Bourguiba",
      "telephone": "+216 71 000 000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("agenceId", pm.response.json().idAgence);
    language: text/javascript
order: 2000
