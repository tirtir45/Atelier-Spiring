$kind: http-request
url: "{{baseUrl}}/api/agences/{{agenceId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Agence Tunis Lac",
      "ville": "Tunis",
      "adresse": "Lac 1",
      "telephone": "+216 71 111 111"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
