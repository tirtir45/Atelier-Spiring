$kind: http-request
url: "{{baseUrl}}/api/contrats"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 480.00,
      "valide": true,
      "paiements": [
        { "montant": 150.00, "datePaiement": "2026-11-02", "modePaiement": "CARTE" },
        { "montant": 330.00, "datePaiement": "2026-11-06", "modePaiement": "VIREMENT" }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("contratId", pm.response.json().idContrat);
    language: text/javascript
order: 3000
