$kind: http-request
url: "{{baseUrl}}/api/employes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Ben Ali",
      "prenom": "Mohamed",
      "role": "AGENT",
      "agence": { "idAgence": 1 }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("employeId", pm.response.json().idEmploye);
    language: text/javascript
order: 2000
