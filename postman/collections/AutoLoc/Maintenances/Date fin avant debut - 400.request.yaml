$kind: http-request
url: "{{baseUrl}}/api/maintenances"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateDebut": "2026-11-10",
      "dateFin": "2026-11-01",
      "description": "Test erreur",
      "vehicule": { "idVehicule": 1 }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
