$kind: http-request
url: "{{baseUrl}}/api/reservations/{{reservationId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dateDebut": "2026-11-10",
      "dateFin": "2026-11-20",
      "statut": "CONFIRMEE",
      "client": { "idClient": 1 },
      "vehicule": { "idVehicule": 1 }
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
