$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "TN-123-AB",
      "marque": "Peugeot",
      "modele": "208",
      "categorie": "CITADINE",
      "tarifJournalier": 55.00,
      "statut": "DISPONIBLE",
      "agence": { "idAgence": 1 }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("vehiculeId", pm.response.json().idVehicule);
    language: text/javascript
order: 2000
