$kind: http-request
url: "{{baseUrl}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "TN-999-ZZ",
      "marque": "Test",
      "modele": "Test",
      "categorie": "SUV",
      "tarifJournalier": -10.00,
      "statut": "DISPONIBLE"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
